# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

title: To Chin Yu
description: Personal site of To Chin Yu
intro: "I work on open problems in physics, mathematics and finance. This site is a wiki: each page sets out one result or one map of a field in full, with proofs, and links to the pages it depends on. Much of the exploration is done with LLM agents."
url: "https://ytcs.github.io"
baseurl: ""


# Pages live in _notes/<project>/<slug>.md and are served at /<project>/<slug>/.
# Projects (the tabs on the home page) and their sections are listed in _data/wiki.yml.
collections:
  notes:
    output: true
    permalink: /:path/

defaults:
  - scope:
      type: notes
    values:
      layout: note
      render_with_liquid: false  # LaTeX braces like {{\rm crit}} would otherwise parse as Liquid

feed:
  path: "/feed/posts.xml"  # the site has no posts; keeps /feed.xml free for notes
  collections:
    notes:
      path: "/feed.xml"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jektex

# Kramdown settings for better math support
kramdown:
  math_engine: mathjax  # emits \( \) and \[ \]; jektex then renders them server-side with our macros
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# Exclude from processing
exclude:
  - CLAUDE.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/

# Author information
author:
  name: To Chin Yu
  email: public@tochinyu.com

footer:
  show_powered_by: false
  contact:

  follow:
    - name: Email
      link: mailto:public@tochinyu.com
    - name: LinkedIn
      link: http://linkedin.com/in/to-chin-yu-281a05136
    - name: GitHub
      link: http://github.com/ytcs
    - name: RSS
      link: /feed.xml

# Used for defeating caching
version: 1

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Seff", "\\Sigma_{\\rm eff}"]
    - ["\\Strue", "\\Sigma_{\\rm true}"]
    - ["\\SBAO", "\\Sigma_{\\rm eff}^{\\rm BAO}"]
    - ["\\zd", "z_{\\rm d}"]
    - ["\\fe", "f_{\\rm eq}"]
    - ["\\fo", "f_{\\rm or}"]
    - ["\\cO", "\\mathcal{O}"]
    - ["\\eV", "\\,\\mathrm{eV}"]
    - ["\\meV", "\\,\\mathrm{meV}"]
